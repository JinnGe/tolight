<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToLight | 灵感：卧室</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>/* same as inspire1 */</style>
</head>
<body>
<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <a href="index.html" class="back-link">← <span data-i18n="back">返回首页</span></a>
        <button id="langToggle" class="lang-btn">English</button>
    </div>
    <h1 data-i18n="title">卧室的助眠星空</h1>
    <p data-i18n="desc1">用户“Cathy”在天花板拼出星云图案，使用“深睡眠”场景：极暗的蓝色渐变，模拟月光透过云层，配合 HomeKit 自动化，每晚 11 点自动开启，助眠效果显著。</p>
    <div class="gallery-container">
        <div class="main-image" id="mainImageContainer">
            <img id="mainImg" src="https://images.pexels.com/photos/2765142/pexels-photo-2765142.jpeg?auto=compress&cs=tinysrgb&w=800&h=500&fit=crop" alt="main">
            <button class="nav-btn prev-btn" id="prevBtn">‹</button>
            <button class="nav-btn next-btn" id="nextBtn">›</button>
        </div>
        <div class="thumbnail-list" id="thumbnailList"></div>
    </div>
    <p data-i18n="desc2">搭配的智能场景：“深睡眠” – 深蓝渐变，促进褪黑素分泌；“晨曦唤醒” – 暖光渐亮，自然唤醒。</p>
    <div class="footer"><p>© 2025 ToLight · <span data-i18n="footer_text">灵感社区</span></p></div>
</div>
<script>
    const images = [
        "https://images.pexels.com/photos/2765142/pexels-photo-2765142.jpeg?auto=compress&cs=tinysrgb&w=800&h=500&fit=crop",
        "https://images.pexels.com/photos/1579396/pexels-photo-1579396.jpeg?auto=compress&cs=tinysrgb&w=800&h=500&fit=crop",
        "https://images.pexels.com/photos/4959566/pexels-photo-4959566.jpeg?auto=compress&cs=tinysrgb&w=800&h=500&fit=crop",
        "https://images.pexels.com/photos/8566482/pexels-photo-8566482.jpeg?auto=compress&cs=tinysrgb&w=800&h=500&fit=crop"
    ];
    let currentIndex = 0;
    const mainImg = document.getElementById('mainImg');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const thumbnailList = document.getElementById('thumbnailList');
    const mainImageContainer = document.getElementById('mainImageContainer');
    function updateGallery(index) {
        currentIndex = (index + images.length) % images.length;
        mainImg.src = images[currentIndex];
        document.querySelectorAll('.thumbnail').forEach((thumb, i) => {
            if (i === currentIndex) thumb.classList.add('active');
            else thumb.classList.remove('active');
        });
    }
    images.forEach((src, idx) => {
        const thumb = document.createElement('img');
        thumb.src = src;
        thumb.classList.add('thumbnail');
        if (idx === 0) thumb.classList.add('active');
        thumb.addEventListener('click', () => updateGallery(idx));
        thumbnailList.appendChild(thumb);
    });
    prevBtn.addEventListener('click', (e) => { e.stopPropagation(); updateGallery(currentIndex - 1); });
    nextBtn.addEventListener('click', (e) => { e.stopPropagation(); updateGallery(currentIndex + 1); });
    mainImageContainer.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (e.deltaY > 0) updateGallery(currentIndex + 1);
        else if (e.deltaY < 0) updateGallery(currentIndex - 1);
    }, { passive: false });

    const translations = {
        zh: {
            back: "返回首页", title: "卧室的助眠星空",
            desc1: "用户“Cathy”在天花板拼出星云图案，使用“深睡眠”场景：极暗的蓝色渐变，模拟月光透过云层，配合 HomeKit 自动化，每晚 11 点自动开启，助眠效果显著。",
            desc2: "搭配的智能场景：“深睡眠” – 深蓝渐变，促进褪黑素分泌；“晨曦唤醒” – 暖光渐亮，自然唤醒。",
            footer_text: "灵感社区"
        },
        en: {
            back: "Back to Home", title: "Bedroom Sleep-Aid Starry Sky",
            desc1: "User 'Cathy' created a nebula pattern on the ceiling using the 'Deep Sleep' scene: extremely dark blue gradient simulating moonlight through clouds, automated with HomeKit to turn on at 11 PM every night — remarkable sleep-aid effect.",
            desc2: "Smart scenes used: 'Deep Sleep' – deep blue gradient to promote melatonin; 'Dawn Wake-up' – warm light gradually brightening for natural awakening.",
            footer_text: "Inspiration Community"
        }
    };
    let currentLang = 'zh';
    function setLanguage(lang) {
        currentLang = lang;
        const t = translations[lang];
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key]) el.innerText = t[key];
        });
        document.getElementById('langToggle').innerText = (lang === 'zh') ? 'English' : '中文';
    }
    document.getElementById('langToggle').addEventListener('click', () => {
        if (currentLang === 'zh') setLanguage('en');
        else setLanguage('zh');
    });
    setLanguage('zh');
</script>
</body>
</html>
