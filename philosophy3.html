<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToLight | 设计哲学：以人为本</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>/* same as philosophy1 */</style>
</head>
<body>
<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <a href="index.html" class="back-link">← <span data-i18n="back">返回首页</span></a>
        <button id="langToggle" class="lang-btn">English</button>
    </div>
    <div class="icon"><i class="fas fa-users"></i></div>
    <h1 data-i18n="title">以人为本</h1>
    <p data-i18n="p1">ToLight 社区汇聚了全球超过百万用户的创意与反馈。我们定期举办设计大赛、开放用户自定义场景分享平台，让每一位用户成为产品共创者。你的生活节奏，就是灯光的节奏。</p>
    <div style="margin-top:2rem;"><h3 data-i18n="subtitle">用户故事</h3><p data-i18n="p2">从电竞选手到室内设计师，从亲子家庭到独立音乐人，ToLight 已成为他们表达个性的媒介。我们倾听每一个声音，持续迭代，让产品真正融入多元生活场景。</p></div>
    <div class="footer"><p>© 2025 ToLight · <span data-i18n="footer_text">光创未来</span></p></div>
</div>
<script>
    const translations = {
        zh: {
            back: "返回首页", title: "以人为本",
            p1: "ToLight 社区汇聚了全球超过百万用户的创意与反馈。我们定期举办设计大赛、开放用户自定义场景分享平台，让每一位用户成为产品共创者。你的生活节奏，就是灯光的节奏。",
            subtitle: "用户故事", p2: "从电竞选手到室内设计师，从亲子家庭到独立音乐人，ToLight 已成为他们表达个性的媒介。我们倾听每一个声音，持续迭代，让产品真正融入多元生活场景。",
            footer_text: "光创未来"
        },
        en: {
            back: "Back to Home", title: "Human First",
            p1: "The ToLight community brings together millions of users' creativity and feedback. We regularly host design contests and an open platform for user-customized scenes, making every user a co-creator. Your life rhythm is the rhythm of light.",
            subtitle: "User Stories", p2: "From eSports players to interior designers, from families to indie musicians, ToLight has become a medium for self-expression. We listen to every voice and iterate continuously, integrating products into diverse lifestyles.",
            footer_text: "Light the Future"
        }
    };
    let currentLang = 'zh';
    function setLanguage(lang) {
        currentLang = lang;
        const t = translations[lang];
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key]) el.innerText = t[key];
        });
        document.getElementById('langToggle').innerText = (lang === 'zh') ? 'English' : '中文';
    }
    document.getElementById('langToggle').addEventListener('click', () => {
        if (currentLang === 'zh') setLanguage('en');
        else setLanguage('zh');
    });
    setLanguage('zh');
</script>
</body>
</html>
