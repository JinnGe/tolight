<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToLight | 动态场景库</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>/* same as feature1 */</style>
</head>
<body>
<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <a href="index.html" class="back-link">← <span data-i18n="back">返回首页</span></a>
        <button id="langToggle" class="lang-btn">English</button>
    </div>
    <div class="icon"><i class="fas fa-palette"></i></div>
    <h1 data-i18n="title">1600万色 动态场景库</h1>
    <p data-i18n="p1">内置超过 100 种官方场景：日出、极光、篝火、霓虹、深海……并支持逐灯颜色自定义。通过 App 可创建无限动态渐变，或从社区下载其他用户分享的场景，让你的奇光板永远新鲜。</p>
    <h3 style="margin-top:1.5rem;" data-i18n="subtitle">特色场景示例</h3>
    <ul style="margin-left:1.5rem;">
        <li data-i18n="scene1">“森林呼吸”：柔和的绿意波动，舒缓压力</li>
        <li data-i18n="scene2">“赛博都市”：霓虹紫与蓝交替，科技感十足</li>
        <li data-i18n="scene3">“熔岩流动”：红橙渐变，充满能量</li>
        <li data-i18n="scene4">“星空闪烁”：随机点点星光，浪漫温馨</li>
    </ul>
    <div class="footer"><p>© 2025 ToLight · <span data-i18n="footer_text">智能生态</span></p></div>
</div>
<script>
    const translations = {
        zh: {
            back: "返回首页", title: "1600万色 动态场景库",
            p1: "内置超过 100 种官方场景：日出、极光、篝火、霓虹、深海……并支持逐灯颜色自定义。通过 App 可创建无限动态渐变，或从社区下载其他用户分享的场景，让你的奇光板永远新鲜。",
            subtitle: "特色场景示例", scene1: "“森林呼吸”：柔和的绿意波动，舒缓压力", scene2: "“赛博都市”：霓虹紫与蓝交替，科技感十足", scene3: "“熔岩流动”：红橙渐变，充满能量", scene4: "“星空闪烁”：随机点点星光，浪漫温馨",
            footer_text: "智能生态"
        },
        en: {
            back: "Back to Home", title: "16M Colors Dynamic Scene Library",
            p1: "Built-in 100+ official scenes: sunrise, aurora, bonfire, neon, deep sea... with per-panel color customization. Create infinite dynamic gradients via the app or download scenes shared by the community to keep your ToLight panels fresh.",
            subtitle: "Featured Scene Examples", scene1: "“Forest Breath”: Gentle green waves to relieve stress", scene2: "“Cyber City”: Neon purple and blue alternating for a tech vibe", scene3: "“Lava Flow”: Red-orange gradient full of energy", scene4: "“Starry Night”: Random twinkling lights, romantic and warm",
            footer_text: "Smart Ecosystem"
        }
    };
    let currentLang = 'zh';
    function setLanguage(lang) {
        currentLang = lang;
        const t = translations[lang];
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key]) el.innerText = t[key];
        });
        document.getElementById('langToggle').innerText = (lang === 'zh') ? 'English' : '中文';
    }
    document.getElementById('langToggle').addEventListener('click', () => {
        if (currentLang === 'zh') setLanguage('en');
        else setLanguage('zh');
    });
    setLanguage('zh');
</script>
</body>
</html>
