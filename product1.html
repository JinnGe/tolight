<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToLight | 六边形交响</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #FFFFFF; color: #1E2A3E; line-height: 1.6; }
        .container { max-width: 1000px; margin: 0 auto; padding: 2rem; }
        .back-link { display: inline-block; margin-bottom: 2rem; color: #2C7BE5; text-decoration: none; font-weight: 500; }
        .back-link:hover { text-decoration: underline; }
        .lang-btn { background: none; border: 1px solid #CBD5E1; padding: 0.3rem 1rem; border-radius: 40px; cursor: pointer; font-family: inherit; font-size: 0.8rem; margin-left: 1rem; }
        h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 0.5rem; }
        .gallery-container { margin: 2rem 0; }
        .main-image { width: 100%; border-radius: 2rem; overflow: hidden; box-shadow: 0 20px 30px rgba(0,0,0,0.1); margin-bottom: 1rem; position: relative; cursor: pointer; }
        .main-image img { width: 100%; display: block; }
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: white; border: none; font-size: 1.8rem; padding: 0.5rem 1rem; cursor: pointer; border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; z-index: 2; }
        .nav-btn:hover { background: rgba(0,0,0,0.8); }
        .prev-btn { left: 1rem; }
        .next-btn { right: 1rem; }
        .thumbnail-list { display: flex; gap: 1rem; overflow-x: auto; padding-bottom: 0.5rem; }
        .thumbnail { width: 80px; height: 80px; object-fit: cover; border-radius: 1rem; cursor: pointer; opacity: 0.6; transition: 0.2s; border: 2px solid transparent; }
        .thumbnail.active { opacity: 1; border-color: #2C7BE5; }
        .product-details { margin: 2rem 0; }
        .price { font-size: 1.8rem; font-weight: 700; color: #2C7BE5; margin: 1rem 0; }
        .btn-primary { background: #2C7BE5; color: white; padding: 0.8rem 1.8rem; border-radius: 40px; text-decoration: none; display: inline-block; margin-top: 0.5rem; border: none; cursor: pointer; }
        .specs { background: #F9FBFE; padding: 1.5rem; border-radius: 1.5rem; margin: 2rem 0; }
        .footer { margin-top: 4rem; padding-top: 2rem; border-top: 1px solid #ECF0F5; text-align: center; color: #6C7D97; }
        @media (max-width: 640px) { .thumbnail { width: 60px; height: 60px; } .nav-btn { width: 36px; height: 36px; font-size: 1.2rem; } }
    </style>
</head>
<body>
<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <a href="index.html" class="back-link">← <span data-i18n="back">返回首页</span></a>
        <button id="langToggle" class="lang-btn">English</button>
    </div>
    <h1 data-i18n="title">六边形交响 · 蜂巢光韵</h1>
    <div class="gallery-container">
        <div class="main-image" id="mainImageContainer">
            <img id="mainImg" src="https://images.pexels.com/photos/2765142/pexels-photo-2765142.jpeg?auto=compress&cs=tinysrgb&w=800&h=800&fit=crop" alt="main">
            <button class="nav-btn prev-btn" id="prevBtn">‹</button>
            <button class="nav-btn next-btn" id="nextBtn">›</button>
        </div>
        <div class="thumbnail-list" id="thumbnailList"></div>
    </div>
    <div class="product-details">
        <p data-i18n="desc">经典六角模块，渐变光晕与流畅色彩过渡，打造沉浸式背景光效。支持Connect+技术，最多可串联500片，随心拼接出独一无二的光影壁画。</p>
        <div class="price" data-i18n="price">¥499 起</div>
        <button class="btn-primary" id="buyBtn" data-i18n="buy">立即购买</button>
    </div>
    <div class="specs">
        <h3 data-i18n="specs_title">产品规格</h3>
        <ul>
            <li data-i18n="spec1">单片尺寸：210mm × 182mm × 12mm</li>
            <li data-i18n="spec2">发光颜色：1600万色 RGB</li>
            <li data-i18n="spec3">控制方式：App / 语音 / 触控</li>
            <li data-i18n="spec4">连接方式：Wi-Fi + 蓝牙 Mesh</li>
        </ul>
    </div>
    <div class="footer"><p>© 2025 ToLight · <span data-i18n="footer_text">光创未来</span></p></div>
</div>
<script>
    const images = [
        "https://images.pexels.com/photos/2765142/pexels-photo-2765142.jpeg?auto=compress&cs=tinysrgb&w=800&h=800&fit=crop",
        "https://images.pexels.com/photos/4108683/pexels-photo-4108683.jpeg?auto=compress&cs=tinysrgb&w=800&h=800&fit=crop",
        "https://images.pexels.com/photos/8566482/pexels-photo-8566482.jpeg?auto=compress&cs=tinysrgb&w=800&h=800&fit=crop",
        "https://images.pexels.com/photos/1579396/pexels-photo-1579396.jpeg?auto=compress&cs=tinysrgb&w=800&h=800&fit=crop"
    ];
    let currentIndex = 0;
    const mainImg = document.getElementById('mainImg');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const thumbnailList = document.getElementById('thumbnailList');
    const mainImageContainer = document.getElementById('mainImageContainer');
    function updateGallery(index) {
        currentIndex = (index + images.length) % images.length;
        mainImg.src = images[currentIndex];
        document.querySelectorAll('.thumbnail').forEach((thumb, i) => {
            if (i === currentIndex) thumb.classList.add('active');
            else thumb.classList.remove('active');
        });
    }
    images.forEach((src, idx) => {
        const thumb = document.createElement('img');
        thumb.src = src;
        thumb.classList.add('thumbnail');
        if (idx === 0) thumb.classList.add('active');
        thumb.addEventListener('click', () => updateGallery(idx));
        thumbnailList.appendChild(thumb);
    });
    prevBtn.addEventListener('click', (e) => { e.stopPropagation(); updateGallery(currentIndex - 1); });
    nextBtn.addEventListener('click', (e) => { e.stopPropagation(); updateGallery(currentIndex + 1); });
    mainImageContainer.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (e.deltaY > 0) updateGallery(currentIndex + 1);
        else if (e.deltaY < 0) updateGallery(currentIndex - 1);
    }, { passive: false });
    document.getElementById('buyBtn').addEventListener('click', () => { alert(translations[currentLang].buy_alert); });

    const translations = {
        zh: {
            back: "返回首页", title: "六边形交响 · 蜂巢光韵",
            desc: "经典六角模块，渐变光晕与流畅色彩过渡，打造沉浸式背景光效。支持Connect+技术，最多可串联500片，随心拼接出独一无二的光影壁画。",
            price: "¥499 起", buy: "立即购买", specs_title: "产品规格",
            spec1: "单片尺寸：210mm × 182mm × 12mm", spec2: "发光颜色：1600万色 RGB",
            spec3: "控制方式：App / 语音 / 触控", spec4: "连接方式：Wi-Fi + 蓝牙 Mesh",
            footer_text: "光创未来", buy_alert: "商品已加入购物车（演示）"
        },
        en: {
            back: "Back to Home", title: "Hex Symphony · Hive Glow",
            desc: "Classic hexagonal modules with smooth gradient glow for an immersive backdrop. Supports Connect+ technology, up to 500 panels linked, creating unique light murals.",
            price: "From $69", buy: "Buy Now", specs_title: "Specifications",
            spec1: "Panel size: 210mm × 182mm × 12mm", spec2: "Lighting: 16M RGB",
            spec3: "Control: App / Voice / Touch", spec4: "Connectivity: Wi-Fi + Bluetooth Mesh",
            footer_text: "Light the Future", buy_alert: "Item added to cart (demo)"
        }
    };
    let currentLang = 'zh';
    function setLanguage(lang) {
        currentLang = lang;
        const t = translations[lang];
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key]) el.innerText = t[key];
        });
        document.getElementById('langToggle').innerText = (lang === 'zh') ? 'English' : '中文';
    }
    document.getElementById('langToggle').addEventListener('click', () => {
        if (currentLang === 'zh') setLanguage('en');
        else setLanguage('zh');
    });
    setLanguage('zh');
</script>
</body>
</html>
