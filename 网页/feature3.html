    <h1>触控 + 手势交互</h1>
    <p>无需手机，直接在奇光板表面轻拍、滑动即可控制灯光。支持自定义手势映射：例如双击切换场景，长按调暗，画圈启动音乐模式。反应灵敏，误触率低，带来未来感十足的操控体验。</p>
