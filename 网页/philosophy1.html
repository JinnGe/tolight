    <h1>始于“为什么”</h1>
    <p>ToLight 的每一次创新都源于对用户真实需求的深刻洞察。我们不止于制造会发光的板子，而是思考：光如何成为情绪的表达、氛围的催化剂、智能生活的核心界面。</p>
    <div class="content">
        <h3>设计驱动</h3>
        <p>我们相信，优秀的设计应该解答“为什么需要这个功能”。例如，音乐律动模式不是炫技，而是为了让派对更沉浸；触控交互不是为了科技感，而是让控制更自然。从用户场景出发，让产品真正服务于人。</p>
