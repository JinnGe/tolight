<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToLight | 设计哲学：始于为什么</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #FFFFFF; color: #1E2A3E; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; padding: 3rem 2rem; }
        .back-link { display: inline-block; margin-bottom: 2rem; color: #2C7BE5; text-decoration: none; font-weight: 500; }
        .lang-btn { background: none; border: 1px solid #CBD5E1; padding: 0.3rem 1rem; border-radius: 40px; cursor: pointer; font-family: inherit; font-size: 0.8rem; margin-left: 1rem; }
        h1 { font-size: 2.2rem; margin-bottom: 1rem; }
        .icon { font-size: 3rem; color: #2C6E9E; margin-bottom: 1rem; }
        .footer { margin-top: 4rem; padding-top: 2rem; border-top: 1px solid #ECF0F5; text-align: center; color: #6C7D97; }
    </style>
</head>
<body>
<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <a href="index.html" class="back-link">← <span data-i18n="back">返回首页</span></a>
        <button id="langToggle" class="lang-btn">English</button>
    </div>
    <div class="icon"><i class="fas fa-lightbulb"></i></div>
    <h1 data-i18n="title">始于“为什么”</h1>
    <p data-i18n="p1">ToLight 的每一次创新都源于对用户真实需求的深刻洞察。我们不止于制造会发光的板子，而是思考：光如何成为情绪的表达、氛围的催化剂、智能生活的核心界面。</p>
    <div style="margin-top:2rem;"><h3 data-i18n="subtitle">设计驱动</h3><p data-i18n="p2">我们相信，优秀的设计应该解答“为什么需要这个功能”。例如，音乐律动模式不是炫技，而是为了让派对更沉浸；触控交互不是为了科技感，而是让控制更自然。从用户场景出发，让产品真正服务于人。</p></div>
    <div class="footer"><p>© 2025 ToLight · <span data-i18n="footer_text">光创未来</span></p></div>
</div>
<script>
    const translations = {
        zh: {
            back: "返回首页", title: "始于“为什么”",
            p1: "ToLight 的每一次创新都源于对用户真实需求的深刻洞察。我们不止于制造会发光的板子，而是思考：光如何成为情绪的表达、氛围的催化剂、智能生活的核心界面。",
            subtitle: "设计驱动", p2: "我们相信，优秀的设计应该解答“为什么需要这个功能”。例如，音乐律动模式不是炫技，而是为了让派对更沉浸；触控交互不是为了科技感，而是让控制更自然。从用户场景出发，让产品真正服务于人。",
            footer_text: "光创未来"
        },
        en: {
            back: "Back to Home", title: "Start with 'Why'",
            p1: "Every innovation at ToLight stems from deep insight into real user needs. We don't just make glowing panels; we ask: how can light become an expression of emotion, a catalyst for atmosphere, and the core interface of smart living?",
            subtitle: "Design Driven", p2: "We believe great design answers 'why this feature is needed'. For example, music sync isn't just for show — it's to make parties more immersive. Touch interaction isn't for techiness — it's to make control natural. Starting from user scenarios, we create products that truly serve people.",
            footer_text: "Light the Future"
        }
    };
    let currentLang = 'zh';
    function setLanguage(lang) {
        currentLang = lang;
        const t = translations[lang];
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key]) el.innerText = t[key];
        });
        document.getElementById('langToggle').innerText = (lang === 'zh') ? 'English' : '中文';
    }
    document.getElementById('langToggle').addEventListener('click', () => {
        if (currentLang === 'zh') setLanguage('en');
        else setLanguage('zh');
    });
    setLanguage('zh');
</script>
</body>
</html>
