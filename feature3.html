<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToLight | 触控手势</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>/* same as feature1 */</style>
</head>
<body>
<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <a href="index.html" class="back-link">← <span data-i18n="back">返回首页</span></a>
        <button id="langToggle" class="lang-btn">English</button>
    </div>
    <div class="icon"><i class="fas fa-hand-back-fist"></i></div>
    <h1 data-i18n="title">触控 + 手势交互</h1>
    <p data-i18n="p1">无需手机，直接在奇光板表面轻拍、滑动即可控制灯光。支持自定义手势映射：例如双击切换场景，长按调暗，画圈启动音乐模式。反应灵敏，误触率低，带来未来感十足的操控体验。</p>
    <h3 style="margin-top:1.5rem;" data-i18n="subtitle">预设手势</h3>
    <ul style="margin-left:1.5rem;">
        <li data-i18n="gesture1">单指单击：开关 / 场景循环</li>
        <li data-i18n="gesture2">双指滑动：调节亮度</li>
        <li data-i18n="gesture3">画圆：启动色彩流动特效</li>
        <li data-i18n="gesture4">轻拍两次：跳转至最喜欢的场景</li>
    </ul>
    <div class="footer"><p>© 2025 ToLight · <span data-i18n="footer_text">智能生态</span></p></div>
</div>
<script>
    const translations = {
        zh: {
            back: "返回首页", title: "触控 + 手势交互",
            p1: "无需手机，直接在奇光板表面轻拍、滑动即可控制灯光。支持自定义手势映射：例如双击切换场景，长按调暗，画圈启动音乐模式。反应灵敏，误触率低，带来未来感十足的操控体验。",
            subtitle: "预设手势", gesture1: "单指单击：开关 / 场景循环", gesture2: "双指滑动：调节亮度", gesture3: "画圆：启动色彩流动特效", gesture4: "轻拍两次：跳转至最喜欢的场景",
            footer_text: "智能生态"
        },
        en: {
            back: "Back to Home", title: "Touch + Gesture Control",
            p1: "No phone needed — tap or swipe directly on the panels to control lighting. Supports custom gesture mapping: double-tap to switch scenes, long-press to dim, draw a circle to start color flow. Responsive and low false-touch rate, delivering a futuristic control experience.",
            subtitle: "Preset Gestures", gesture1: "Single tap: On/Off / Scene cycle", gesture2: "Two-finger swipe: Adjust brightness", gesture3: "Draw a circle: Start color flow effect", gesture4: "Double tap: Jump to favorite scene",
            footer_text: "Smart Ecosystem"
        }
    };
    let currentLang = 'zh';
    function setLanguage(lang) {
        currentLang = lang;
        const t = translations[lang];
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key]) el.innerText = t[key];
        });
        document.getElementById('langToggle').innerText = (lang === 'zh') ? 'English' : '中文';
    }
    document.getElementById('langToggle').addEventListener('click', () => {
        if (currentLang === 'zh') setLanguage('en');
        else setLanguage('zh');
    });
    setLanguage('zh');
</script>
</body>
</html>
